name: Evaluation Pilot Harness

on:
  pull_request:
    paths:
      - "scripts/run_eval_01.py"
      - "scripts/check_eval01_fixture_contract.py"
      - "scripts/run_eval_01b_replay_diagnostic.py"
      - ".data/Frozen_v1/**"
      - "docs/development/EVALUATION-PILOT-RUNBOOK.md"
      - "promt.md"
      - ".github/workflows/eval-pilot.yml"
  push:
    branches:
      - main
      - astra/eval-01-harness-correction
    paths:
      - "scripts/run_eval_01.py"
      - "scripts/check_eval01_fixture_contract.py"
      - "scripts/run_eval_01b_replay_diagnostic.py"
      - ".data/Frozen_v1/**"
      - "docs/development/EVALUATION-PILOT-RUNBOOK.md"
      - "promt.md"
      - ".github/workflows/eval-pilot.yml"

jobs:
  harness-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile evaluation harness
        run: |
          python -m py_compile scripts/run_eval_01.py
          python -m py_compile scripts/check_eval01_fixture_contract.py
          python -m py_compile scripts/run_eval_01b_replay_diagnostic.py
      - name: Validate frozen corpus and harness contract
        run: python scripts/check_eval01_fixture_contract.py
      - name: Run offline replay temporal-intent diagnostic
        run: python scripts/run_eval_01b_replay_diagnostic.py --stdout-only
