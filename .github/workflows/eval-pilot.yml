name: Evaluation Pilot Harness

on:
  pull_request:
    paths:
      - "scripts/run_eval_01.py"
      - "scripts/check_eval01_fixture_contract.py"
      - "scripts/run_eval_01b_replay_diagnostic.py"
      - "scripts/run_eval_01c_dual_lane_intent.py"
      - "scripts/run_eval_01d_provenance_ab.py"
      - "scripts/run_eval_01e_sealed_provenance_ab.py"
      - "scripts/run_eval_01f_compact_provenance_budget.py"
      - "scripts/run_eval_01g_full_context_pressure.py"
      - "scripts/run_eval_01h_prod8_context_scope.py"
      - "scripts/run_eval_01i_context_budget_scaling.py"
      - "scripts/run_eval_01j_adaptive_budget_scale.py"
      - "scripts/run_eval_01k_multilane_growth_stress.py"
      - "benchmarks/eval01e_neutral_context.json"
      - ".data/Frozen_v1/**"
      - "docs/development/EVALUATION-PILOT-RUNBOOK.md"
      - "promt.md"
      - ".github/workflows/eval-pilot.yml"
  push:
    branches:
      - main
      - astra/eval-01-harness-correction
    paths:
      - "scripts/run_eval_01.py"
      - "scripts/check_eval01_fixture_contract.py"
      - "scripts/run_eval_01b_replay_diagnostic.py"
      - "scripts/run_eval_01c_dual_lane_intent.py"
      - "scripts/run_eval_01d_provenance_ab.py"
      - "scripts/run_eval_01e_sealed_provenance_ab.py"
      - "scripts/run_eval_01f_compact_provenance_budget.py"
      - "scripts/run_eval_01g_full_context_pressure.py"
      - "scripts/run_eval_01h_prod8_context_scope.py"
      - "scripts/run_eval_01i_context_budget_scaling.py"
      - "scripts/run_eval_01j_adaptive_budget_scale.py"
      - "scripts/run_eval_01k_multilane_growth_stress.py"
      - "benchmarks/eval01e_neutral_context.json"
      - ".data/Frozen_v1/**"
      - "docs/development/EVALUATION-PILOT-RUNBOOK.md"
      - "promt.md"
      - ".github/workflows/eval-pilot.yml"

jobs:
  harness-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile evaluation harness
        run: |
          python -m py_compile scripts/run_eval_01.py
          python -m py_compile scripts/check_eval01_fixture_contract.py
          python -m py_compile scripts/run_eval_01b_replay_diagnostic.py
          python -m py_compile scripts/run_eval_01c_dual_lane_intent.py
          python -m py_compile scripts/run_eval_01d_provenance_ab.py
          python -m py_compile scripts/run_eval_01e_sealed_provenance_ab.py
          python -m py_compile scripts/run_eval_01f_compact_provenance_budget.py
          python -m py_compile scripts/run_eval_01g_full_context_pressure.py
          python -m py_compile scripts/run_eval_01h_prod8_context_scope.py
          python -m py_compile scripts/run_eval_01i_context_budget_scaling.py
          python -m py_compile scripts/run_eval_01j_adaptive_budget_scale.py
          python -m py_compile scripts/run_eval_01k_multilane_growth_stress.py
      - name: Validate frozen corpus and harness contract
        run: python scripts/check_eval01_fixture_contract.py
      - name: Run offline replay temporal-intent diagnostic
        run: python scripts/run_eval_01b_replay_diagnostic.py --stdout-only
      - name: Run offline dual-lane intent diagnostic
        run: python scripts/run_eval_01c_dual_lane_intent.py --stdout-only
      - name: Validate provenance generation A/B isolation
        run: python scripts/run_eval_01d_provenance_ab.py --dry-run --stdout-only
      - name: Validate sealed provenance A/B protocol
        run: python scripts/run_eval_01e_sealed_provenance_ab.py --stage dry-run
      - name: Validate compact provenance budget diagnostic
        run: python scripts/run_eval_01f_compact_provenance_budget.py --stdout-only
      - name: Validate full context pressure diagnostic
        run: python scripts/run_eval_01g_full_context_pressure.py --stdout-only
      - name: Validate production-limit context scope diagnostic
        run: python scripts/run_eval_01h_prod8_context_scope.py --stdout-only
      - name: Validate context budget scaling diagnostic
        run: python scripts/run_eval_01i_context_budget_scaling.py --stdout-only
      - name: Validate adaptive budget scale stress
        run: python scripts/run_eval_01j_adaptive_budget_scale.py --stdout-only
      - name: Validate multi-lane growth stress
        run: python scripts/run_eval_01k_multilane_growth_stress.py --stdout-only
