name: P2 Setup Provenance Foundation

on:
  pull_request:
    branches: [integration/p2-planning-studio]
    paths:
      - 'ai-service/**'
      - 'backend/**'
      - 'web/**'
      - '.github/workflows/p2-setup-provenance.yml'

permissions:
  contents: read

jobs:
  setup-postgres-gateway-browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
        env:
          POSTGRES_DB: p2a
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d p2a"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mongodb:
        image: mongo:7
        ports: [27017:27017]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/p2a
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/p2a
      MONGODB_URI: mongodb://localhost:27017/p2a
      NODE_ENV: test
      APP_ENV: test
      LLM_PROVIDER: fake
      LLM_ENABLED: "true"
      EMBEDDING_PROVIDER: fake
      ACTIVE_EMBEDDING_VERSION: fake-embedding-768-v1
      SEMANTIC_RETRIEVAL_ENABLED: "false"
      ENTITY_CANDIDATE_VERIFICATION_ENABLED: "false"
      NARRATIVE_REPOSITORY: postgres
      SERVICE_AUTH_DISABLED: "false"
      PLATFORM_SERVICE_TOKEN: p202-offline-token
      PLATFORM_API_BASE_URL: http://127.0.0.1:57114
      AI_SERVICE_URL: http://127.0.0.1:58001
      JWT_ACCESS_SECRET: p202-offline-access-secret
      JWT_REFRESH_SECRET: p202-offline-refresh-secret
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install fake-only test runtime dependencies
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p202"
          pip install -r ai-service/requirements.txt pytest httpx
          npm ci --prefix backend
          npm ci --prefix web
      - name: Pin feature source and disposable service identities
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/p202/source-sha.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/p202/source-tree.txt"
          docker inspect --format '{{.Config.Image}} {{.Image}}' "${{ job.services.postgres.id }}" "${{ job.services.mongodb.id }}" > "$RUNNER_TEMP/p202/service-images.txt"
          python - <<'PY' > "$RUNNER_TEMP/p202/postgres-identity.json"
          import psycopg, json
          with psycopg.connect('postgresql://postgres:postgres@localhost:5432/p2a') as c:
              name, version = c.execute('SELECT current_database(), version()').fetchone()
              assert name == 'p2a'
              print(json.dumps(dict(database=name, version=version)))
          PY
          (cd backend && node --input-type=module <<'JS') > "$RUNNER_TEMP/p202/mongo-identity.json"
          import {MongoClient} from 'mongodb';
          const c = new MongoClient(process.env.MONGODB_URI);
          await c.connect();
          const db = c.db();
          if (db.databaseName !== 'p2a') throw new Error('Wrong isolated database');
          console.log(JSON.stringify({database:db.databaseName,version:(await db.admin().serverInfo()).version}));
          await c.close();
          JS
          printf 'LLM_PROVIDER=fake\nEMBEDDING_PROVIDER=fake\nSERVICE_AUTH_DISABLED=false\nNo paid-provider secrets supplied\n' > "$RUNNER_TEMP/p202/provider-config.txt"
      - name: Apply existing backend and narrative migrations
        run: |
          set -euo pipefail
          (cd backend && npm run db:migrate) 2>&1 | tee "$RUNNER_TEMP/p202/node-migrations.log"
          (cd ai-service && DATABASE_URL="$TEST_DATABASE_URL" python -m alembic upgrade head) 2>&1 | tee "$RUNNER_TEMP/p202/alembic.log"
      # P7/P8 retain full legacy route coverage; this job keeps service authentication enabled.
      - name: Setup parsing and P1 manuscript service regression
        working-directory: ai-service
        run: |
          set -euo pipefail
          pytest -q -o addopts= -p no:cacheprovider --basetemp="$RUNNER_TEMP/p2-focused" --junitxml="$RUNNER_TEMP/p202/focused.xml" tests/test_setup_v1.py tests/test_p2_bootstrap_guard.py tests/test_p2_bootstrap_pacing_compat.py tests/test_p2_json_bootstrap_compat.py tests/test_manuscript_bootstrap.py tests/test_brainstorm_service.py 2>&1 | tee "$RUNNER_TEMP/p202/focused.log"
      - name: Real PostgreSQL A16 with durable before and after readbacks
        working-directory: ai-service
        env:
          F04_MONGO_EVIDENCE: "1"
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/p2a
        run: |
          set -euo pipefail
          pytest -o addopts= -vv -s -m postgres_integration --basetemp="$RUNNER_TEMP/p2-a16" --junitxml="$RUNNER_TEMP/p202/a16.xml" tests/test_p2_bootstrap_postgres.py tests/test_setup_v1_postgres.py tests/test_setup_author_scope_postgres.py tests/test_setup_review_postgres.py tests/test_plan_edit_postgres.py tests/test_plan_review_fixes_postgres.py tests/test_writing_plan_authority_postgres.py tests/test_setup_activation_postgres.py tests/test_world_rule_effective_head_postgres.py tests/test_setup_amendment_postgres.py tests/test_brainstorm_postgres.py 2>&1 | tee "$RUNNER_TEMP/p202/a16.log"
      - name: Start real AI service with fake providers
        working-directory: ai-service
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/p2a
        run: |
          set -euo pipefail
          python -m uvicorn main:app --host 127.0.0.1 --port 58001 > "$RUNNER_TEMP/p202/ai-service.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/p202/ai.pid"
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:58001/health; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Gateway forwarding contracts and P1 save revision outbox acceptance
        working-directory: backend
        env:
          TEST_P2A_LIVE: "1"
        run: |
          set -euo pipefail
          npx tsx --test src/modules/ai/ai-gateway.test.ts src/modules/ai/p1-closed-loop-gateway.test.ts 2>&1 | tee "$RUNNER_TEMP/p202/gateway-forwarding.log"
          P2A_EVIDENCE_FILE="$RUNNER_TEMP/p202/gateway-readbacks.json" npx tsx --test src/modules/ai/p2-bootstrap-guard.live.test.ts 2>&1 | tee "$RUNNER_TEMP/p202/gateway-a16.log"
      - name: Setup owner readback through real Gateway and PostgreSQL
        working-directory: backend
        env:
          TEST_P2A_LIVE: "1"
        run: |
          set -euo pipefail
          P202_EVIDENCE_FILE="$RUNNER_TEMP/p202/setup-gateway-readbacks.json" npx tsx --test src/modules/ai/setup-provenance.live.test.ts 2>&1 | tee "$RUNNER_TEMP/p202/setup-gateway.log"
      - name: Restart task AI service with existing P1 entity HITL enabled
        working-directory: ai-service
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/p2a
          ENTITY_CANDIDATE_VERIFICATION_ENABLED: "true"
          ENTITY_PIPELINE_VERSION: entity-human-review-v1
        run: |
          set -euo pipefail
          kill "$(cat "$RUNNER_TEMP/p202/ai.pid")"
          for i in {1..30}; do
            if ! curl -fsS http://127.0.0.1:58001/health; then break; fi
            sleep 1
          done
          python -m uvicorn main:app --host 127.0.0.1 --port 58001 > "$RUNNER_TEMP/p202/m0-ai-service.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/p202/ai.pid"
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:58001/health; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verified M0 and genuine first chapter Gateway PG Mongo P1 HITL bridge
        working-directory: backend
        env:
          TEST_P2A_LIVE: "1"
        run: |
          set -euo pipefail
          P204_EVIDENCE_FILE="$RUNNER_TEMP/p202/m0-writer-readbacks.json" npx tsx --test src/modules/ai/m0-first-chapter.live.test.ts 2>&1 | tee "$RUNNER_TEMP/p202/m0-writer.log"
      - name: Mounted setup UI browser interactions (mocked HTTP)
        working-directory: web
        env:
          PLAYWRIGHT_CHANNEL: chromium
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          P204_M0_SCREENSHOT="$RUNNER_TEMP/p202/m0-ui.png" P203_FIX_EVENT_SCREENSHOT="$RUNNER_TEMP/p202/fix-events-ui.png" P203_FIX_ARCHIVE_SCREENSHOT="$RUNNER_TEMP/p202/fix-archive-ui.png" P203_SCREENSHOT="$RUNNER_TEMP/p202/plan-ui.png" P202_REVIEW_SCREENSHOT="$RUNNER_TEMP/p202/review-ui.png" node --test tests/setup-foundation.browser.test.mjs 2>&1 | tee "$RUNNER_TEMP/p202/setup-browser.log"
      - name: Stop only the task AI process
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/p202/ai.pid"; then
            kill "$(cat "$RUNNER_TEMP/p202/ai.pid")"
          fi
      - name: Build mounted Author IDE and Planning Studio
        working-directory: web
        run: npm run build
      - name: Actual author IDE planning journey (Chromium HTTP mocks)
        working-directory: web
        env:
          PLAYWRIGHT_CHANNEL: chromium
          P205_EVIDENCE_DIR: ${{ runner.temp }}/p202/planning-studio
        run: |
          set -euo pipefail
          node --test tests/planning-studio.browser.test.mjs 2>&1 | tee "$RUNNER_TEMP/p202/planning-studio-browser.log"
      - name: Story Planning Studio UX-01 & UX-04 regression (Chromium HTTP mocks)
        working-directory: web
        env:
          PLAYWRIGHT_CHANNEL: chromium
          P207A_EVIDENCE_DIR: ${{ runner.temp }}/p202/p2-07a-regression
        run: |
          set -euo pipefail
          node --test tests/p2-07a-ux01-ux04-regression.browser.test.mjs 2>&1 | tee "$RUNNER_TEMP/p202/p2-07a-regression.log"
      - name: Story Planning Studio UX-03 World Setup Review regression (Chromium HTTP mocks)
        working-directory: web
        env:
          PLAYWRIGHT_CHANNEL: chromium
          P207B_EVIDENCE_DIR: ${{ runner.temp }}/p202/p2-07b-regression
        run: |
          set -euo pipefail
          node --test tests/p2-07b-ux03-world-review.browser.test.mjs 2>&1 | tee "$RUNNER_TEMP/p202/p2-07b-regression.log"
      - name: Story Planning Studio UX-05 World Setup Rule Amendments regression (Chromium HTTP mocks)
        working-directory: web
        env:
          PLAYWRIGHT_CHANNEL: chromium
          P207F_EVIDENCE_DIR: ${{ runner.temp }}/p202/p2-07f-regression
        run: |
          set -euo pipefail
          node --test tests/p2-07f-ux05-world-amendment.browser.test.mjs 2>&1 | tee "$RUNNER_TEMP/p202/p2-07f-regression.log"
      - name: Mounted P1 Writer autosave recovery on isolated PG Mongo
        working-directory: web
        env:
          RUN_DRAFT_BROWSER_TESTS: "1"
          PLAYWRIGHT_CHANNEL: chromium
          P1_EVIDENCE_DIR: ${{ runner.temp }}/p202/p1-writer-browser
        run: |
          set -euo pipefail
          node --test tests/author-ide.browser.test.mjs tests/draft-persistence.browser.test.mjs 2>&1 | tee "$RUNNER_TEMP/p202/p1-writer-browser.log"
      - name: Verify setup operational logs exclude private input
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'p202'
          checked = []
          for name in ('ai-service.log', 'setup-gateway.log', 'm0-ai-service.log', 'm0-writer.log'):
              path = root / name
              assert path.exists(), 'Missing operational log: ' + name
              value = path.read_text()
              assert all(marker not in value for marker in ('PrivateOnly', 'ConstraintOnly', 'M0PrivateOnly', 'private_author_notes', 'author_constraints')), name
              checked.append(name)
          (root / 'private-log-scan.json').write_text(json.dumps({'checked':checked,'private_markers_absent':True}))
          PY
      - name: Upload setup foundation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-setup-foundation-evidence
          path: ${{ runner.temp }}/p202/
          if-no-files-found: error
