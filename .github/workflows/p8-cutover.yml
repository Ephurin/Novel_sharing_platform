name: P8 Cutover and Migration

on:
  push:
    branches:
      - astra/p8-cutover
      - astra/p8-02-frontend-api-cutover
      - astra/p8-03-legacy-json-readonly
      - astra/p8-04-rollback-cleanup-readiness
      - astra/p8-05-final-cleanup-gate
  pull_request:
    paths:
      - "ai-service/**"
      - "backend/**"
      - "web/**"
      - "mobile/**"
      - "scripts/check_p8_frontend_api_cutover.py"
      - "scripts/check_p8_cleanup_readiness.py"
      - "scripts/check_p8_final_cleanup_gate.py"
      - "docs/development/P8-05-FINAL-CLEANUP-GATE/**"
      - "docker-compose.yml"
      - ".github/workflows/p8-cutover.yml"

jobs:
  frontend-api-cutover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            backend/package-lock.json
            mobile/package-lock.json
      - name: Enforce browser/mobile Node-gateway boundary
        run: python scripts/check_p8_frontend_api_cutover.py
      - name: Web build
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Verify built web assets do not expose FastAPI
        run: |
          set -euo pipefail
          if grep -R -n -E '127\.0\.0\.1:8000|localhost:8000|VITE_AI_SERVICE_BASE_URL|VITE_AI_TENANT_ID|/v1/story-brains|/v1/writing/generations|/internal/v1/' web/dist; then
            echo "Built web assets expose a forbidden direct AI-service reference." >&2
            exit 1
          fi
      - name: Backend typecheck and deterministic tests
        working-directory: backend
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ephurin_ci_placeholder
          MONGODB_URI: mongodb://localhost:27017/ephurin_ci_placeholder
          JWT_ACCESS_SECRET: p8-ci-access-secret
          JWT_REFRESH_SECRET: p8-ci-refresh-secret
          PLATFORM_SERVICE_TOKEN: p8-ci-service-token
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          mapfile -t tests < <(find src -name '*.test.ts' ! -name '*.live.test.ts' ! -name '*.postgres.test.ts' -print | sort)
          test "${#tests[@]}" -gt 0
          npx tsx --test "${tests[@]}"
          test -f src/modules/ai/ai-gateway.test.ts
      - name: Mobile typecheck
        working-directory: mobile
        run: |
          npm ci
          npm run typecheck

  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - run: pip install -r requirements.txt pytest httpx
      - name: Full AI-service non-PostgreSQL regression
        run: pytest -q

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: p8_cutover
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d p8_cutover"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/p8_cutover
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/p8_cutover
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - run: pip install -r requirements.txt pytest httpx
      - name: Live PostgreSQL integration suite
        run: pytest -o addopts= -q -m postgres_integration

  root-compose-cutover-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config
      - name: Start production-path services
        env:
          LLM_PROVIDER: fake
          PLATFORM_SERVICE_TOKEN: test-token
          EMBEDDING_PROVIDER: fake
          SEMANTIC_RETRIEVAL_ENABLED: "true"
          ACTIVE_EMBEDDING_VERSION: fake-embedding-768-v1
        run: docker compose up -d --build postgres mongodb ai-service backend web
      - name: Wait for health
        run: |
          set -euo pipefail
          for i in {1..60}; do
            if curl -fsS http://localhost:8000/health >/dev/null && curl -fsS http://localhost:4000/api/v1/health >/dev/null && curl -fsS http://localhost:8080/ >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          docker compose ps
          docker compose logs ai-service backend postgres
          exit 1
      - name: Dry-run committed legacy StoryKB inventory
        run: |
          set -euo pipefail
          # Production images intentionally exclude data/writing_session_*.json.
          # Copy the committed checkout snapshot into a temporary container path
          # so the production runtime validates every legacy file without
          # changing what is shipped in the image.
          docker compose exec -T ai-service mkdir -p /tmp/p8-repo-data
          docker compose cp ai-service/data/. ai-service:/tmp/p8-repo-data
          docker compose exec -T ai-service python -m application.migrate_json_to_postgres \
            --json-storage /tmp/p8-repo-data --all --output /tmp/repo-inventory.json
          docker compose exec -T ai-service python - <<'PY'
          import json
          expected = {
              "writing_session_550",
              "writing_session_599",
              "writing_session_968",
              "writing_session_492",
              "test2",
              "test_narrative_v2",
          }
          data=json.load(open("/tmp/repo-inventory.json"))
          stories=data["stories"]
          assert {item["story_id"] for item in stories} == expected
          assert all(item["action"] == "ready" for item in stories)
          assert all(item["safe_to_apply"] is True for item in stories)
          assert all(item["unsupported"] == [] for item in stories)
          print(json.dumps({
              item["story_id"]: {
                  "action": item["action"],
                  "warning_fields": [w["field"] for w in item["warnings"]],
              }
              for item in stories
          }, ensure_ascii=False, sort_keys=True))
          PY
      - name: Run cutover CLI dry-run apply and idempotent reapply
        run: |
          set -euo pipefail
          story_id="11111111-2222-3333-4444-555555555555"
          docker compose exec -T ai-service sh -lc "mkdir -p /tmp/p8-json && cat > /tmp/p8-json/$story_id.json <<'JSON'
          {
            \"story_id\": \"11111111-2222-3333-4444-555555555555\",
            \"metadata\": {\"brain_version\": \"3\", \"status\": \"active\"},
            \"entities\": {
              \"elena\": {
                \"name\": \"Elena\",
                \"entity_type\": \"character\",
                \"status\": \"Alive\",
                \"location\": \"Observatory\",
                \"mentions\": 4,
                \"is_locked\": true
              }
            }
          }
          JSON
          sha256sum /tmp/p8-json/$story_id.json | cut -d' ' -f1 > /tmp/source.before
          python -m application.migrate_json_to_postgres --json-storage /tmp/p8-json --story-id $story_id --output /tmp/dry-run.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/dry-run.json'))
          story=data['stories'][0]
          assert data['mode']=='dry-run'
          assert story['action']=='ready'
          assert story['safe_to_apply'] is True
          print(json.dumps(story, sort_keys=True))
          PY
          python -m application.migrate_json_to_postgres --json-storage /tmp/p8-json --story-id $story_id --apply --output /tmp/apply.json
          python - <<'PY'
          import json
          story=json.load(open('/tmp/apply.json'))['stories'][0]
          assert story['action']=='already_migrated'
          assert story['applied'] is True
          assert story['parity'] is True
          assert story['source_unchanged'] is True
          print(json.dumps(story, sort_keys=True))
          PY
          python -m application.migrate_json_to_postgres --json-storage /tmp/p8-json --story-id $story_id --apply --output /tmp/reapply.json
          python - <<'PY'
          import json
          story=json.load(open('/tmp/reapply.json'))['stories'][0]
          assert story['action']=='already_migrated'
          assert story['applied'] is False
          assert story['idempotent'] is True
          print(json.dumps(story, sort_keys=True))
          PY
          sha256sum /tmp/p8-json/$story_id.json | cut -d' ' -f1 > /tmp/source.after
          diff -u /tmp/source.before /tmp/source.after"
      - name: Verify nginx gateway boundary and built assets
        run: |
          set -euo pipefail
          gateway_url="http://localhost:8080/api/v1/ai/story-brains/11111111-2222-3333-4444-555555555555/context-preview"
          gateway_status="$(curl -sS -o /tmp/gateway.json -w '%{http_code}' "$gateway_url")"
          test "$gateway_status" = "401"
          grep -q '"code":"AUTH_001"' /tmp/gateway.json || grep -q '"code":"UNAUTHORIZED"' /tmp/gateway.json || true
          if docker compose exec -T web sh -lc "grep -R -n -E '127\\.0\\.0\\.1:8000|localhost:8000|VITE_AI_SERVICE_BASE_URL|VITE_AI_TENANT_ID|/v1/story-brains|/v1/writing/generations|/internal/v1/' /usr/share/nginx/html"; then
            echo "Deployed web assets expose a forbidden direct AI-service reference." >&2
            exit 1
          fi

      - name: Verify existing production path still healthy
        run: |
          set -euo pipefail
          docker compose exec -T postgres psql -U postgres -d ephurin -Atc "SELECT extname FROM pg_extension WHERE extname='vector'" | grep -qx vector
          route="http://localhost:8000/v1/story-brains/11111111-2222-3333-4444-555555555555/context-preview"
          missing="$(curl -sS -o /tmp/missing.json -w '%{http_code}' "$route")"
          invalid="$(curl -sS -o /tmp/invalid.json -w '%{http_code}' -H 'Authorization: Bearer invalid-token' "$route")"
          valid_route="http://localhost:8000/v1/story-brains/by-novel/11111111-2222-3333-4444-555555555555"
          valid="$(curl -sS -o /tmp/valid.json -w '%{http_code}' -H 'Authorization: Bearer test-token' "$valid_route")"
          test "$missing" = "401"
          test "$invalid" = "403"
          test "$valid" = "200"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install AI-PIPE-01A validation dependencies
        run: pip install httpx psycopg
      - name: Run Gate AI-PIPE-01A Production Persistence Validation
        run: python scripts/run_ai_pipe_01a_production_persistence.py
      - name: Verify Gate AI-PIPE-01 & AI-PIPE-01A Evidence Schema and Invariants
        run: python scripts/verify_ai_pipe_01_p1_closed_loop_evidence.py
      - name: Run Backend PostgreSQL Production Persistence Integration Suite
        run: docker compose exec -T backend npx tsx --test --test-force-exit src/modules/novels/p1-production-persistence.postgres.test.ts

      - name: Show service status
        if: always()
        run: docker compose ps
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color postgres mongodb ai-service backend web
      - name: Shutdown
        if: always()
        run: docker compose down -v


  rollback-rehearsal:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: p8_rehearsal
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d p8_rehearsal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SOURCE_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/p8_rehearsal
      RESTORE_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/p8_restore_verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - name: Install AI-service dependencies
        working-directory: ai-service
        run: pip install -r requirements.txt pytest httpx
      - name: Enforce cleanup readiness boundary
        run: python scripts/check_p8_cleanup_readiness.py
      - name: Prepare source database and seed canonical cutover fixture
        working-directory: ai-service
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/p8_rehearsal
          NARRATIVE_REPOSITORY: postgres
          APP_ENV: test
        run: |
          set -euo pipefail
          python -m alembic upgrade head
          mkdir -p /tmp/p8-rollback-json
          cat > /tmp/p8-rollback-json/11111111-2222-3333-4444-555555555555.json <<'JSON'
          {
            "story_id": "11111111-2222-3333-4444-555555555555",
            "metadata": {"brain_version": "3", "status": "active"},
            "entities": {
              "elena": {
                "name": "Elena",
                "entity_type": "character",
                "status": "Alive",
                "location": "Observatory",
                "mentions": 4,
                "is_locked": true
              }
            }
          }
          JSON
          python -m application.migrate_json_to_postgres             --json-storage /tmp/p8-rollback-json             --story-id 11111111-2222-3333-4444-555555555555             --apply             --output /tmp/p8-rehearsal-seed.json
      - name: Capture source schema/version/snapshot
        working-directory: ai-service
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/p8_rehearsal
          NARRATIVE_REPOSITORY: postgres
          APP_ENV: test
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from core.settings import Settings
          from core.story_kb_manager import StoryKBManager
          from infrastructure.repository_factory import build_narrative_repository
          repo = build_narrative_repository(Settings.from_env(), StoryKBManager("/tmp/p8-unused"))
          data = repo.export_snapshot("11111111-2222-3333-4444-555555555555")
          with open("/tmp/source-snapshot.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, sort_keys=True, indent=2)
          engine = getattr(repo, "engine", None)
          if engine is not None:
              engine.dispose()
          PY
          psql postgresql://postgres:postgres@localhost:5432/p8_rehearsal -Atc             "SELECT version_num FROM alembic_version ORDER BY version_num" > /tmp/source-alembic.txt
          psql postgresql://postgres:postgres@localhost:5432/p8_rehearsal -Atc             "SELECT extname || ':' || extversion FROM pg_extension WHERE extname='vector'" > /tmp/source-vector.txt
      - name: Backup source database
        run: |
          set -euo pipefail
          pg_dump             --format=custom             --no-owner             --no-acl             --dbname=postgresql://postgres:postgres@localhost:5432/p8_rehearsal             --file=/tmp/p8-rehearsal.dump
          test -s /tmp/p8-rehearsal.dump
          sha256sum /tmp/p8-rehearsal.dump > /tmp/p8-rehearsal.dump.sha256
      - name: Restore into isolated verification database
        run: |
          set -euo pipefail
          psql postgresql://postgres:postgres@localhost:5432/postgres -v ON_ERROR_STOP=1             -c "CREATE DATABASE p8_restore_verify"
          pg_restore             --exit-on-error             --no-owner             --no-acl             --dbname=postgresql://postgres:postgres@localhost:5432/p8_restore_verify             /tmp/p8-rehearsal.dump
      - name: Verify restored migration state and canonical parity
        working-directory: ai-service
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/p8_restore_verify
          NARRATIVE_REPOSITORY: postgres
          APP_ENV: test
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from core.settings import Settings
          from core.story_kb_manager import StoryKBManager
          from infrastructure.repository_factory import build_narrative_repository
          repo = build_narrative_repository(Settings.from_env(), StoryKBManager("/tmp/p8-unused-restore"))
          restored = repo.export_snapshot("11111111-2222-3333-4444-555555555555")
          with open("/tmp/source-snapshot.json", encoding="utf-8") as f:
              source = json.load(f)
          assert restored == source, "canonical snapshot changed after backup/restore"
          engine = getattr(repo, "engine", None)
          if engine is not None:
              engine.dispose()
          print("canonical restore parity: PASS")
          PY
          psql postgresql://postgres:postgres@localhost:5432/p8_restore_verify -Atc             "SELECT version_num FROM alembic_version ORDER BY version_num" > /tmp/restore-alembic.txt
          psql postgresql://postgres:postgres@localhost:5432/p8_restore_verify -Atc             "SELECT extname || ':' || extversion FROM pg_extension WHERE extname='vector'" > /tmp/restore-vector.txt
          diff -u /tmp/source-alembic.txt /tmp/restore-alembic.txt
          diff -u /tmp/source-vector.txt /tmp/restore-vector.txt
      - name: Prove source database was not mutated by rehearsal restore
        working-directory: ai-service
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/p8_rehearsal
          NARRATIVE_REPOSITORY: postgres
          APP_ENV: test
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from core.settings import Settings
          from core.story_kb_manager import StoryKBManager
          from infrastructure.repository_factory import build_narrative_repository
          repo = build_narrative_repository(Settings.from_env(), StoryKBManager("/tmp/p8-unused-final"))
          current = repo.export_snapshot("11111111-2222-3333-4444-555555555555")
          with open("/tmp/source-snapshot.json", encoding="utf-8") as f:
              before = json.load(f)
          assert current == before, "source database changed during restore rehearsal"
          engine = getattr(repo, "engine", None)
          if engine is not None:
              engine.dispose()
          print("source database unchanged: PASS")
          PY


  final-cleanup-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm production cleanup preconditions remain intact
        run: python scripts/check_p8_cleanup_readiness.py
      - name: Assert destructive P8-05 cleanup is still blocked
        run: python scripts/check_p8_final_cleanup_gate.py --expect-blocked
      - name: Test final cleanup gate state transitions
        run: |
          set -euo pipefail
          cat > /tmp/p8-open-gate.json <<'JSON'
          {
            "release_identifier": "synthetic-ci-release",
            "observation_window_started_at": "2026-01-01T00:00:00Z",
            "observation_window_ended_at": "2026-01-02T00:00:00Z",
            "observation_window_completed": true,
            "production_json_writes_zero": true,
            "rollback_path_retained": true,
            "error_budget_status": "within_budget",
            "open_rollback_incidents": 0,
            "supervisor_cleanup_gate_accepted": true,
            "evidence": ["synthetic-ci-only"]
          }
          JSON
          python scripts/check_p8_final_cleanup_gate.py --gate /tmp/p8-open-gate.json --require-open
          if python scripts/check_p8_final_cleanup_gate.py --gate /tmp/p8-open-gate.json --expect-blocked; then
            echo "Open synthetic gate incorrectly passed --expect-blocked" >&2
            exit 1
          fi
      - name: Validate cleanup manifest safety contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("docs/development/P8-05-FINAL-CLEANUP-GATE/cleanup-manifest.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          assert data["destructive_cleanup_authorized"] is False
          retained = {item["path"] for item in data["retain_offline_migration_and_test_tooling"]}
          assert "ai-service/core/story_kb_manager.py" in retained
          assert "ai-service/infrastructure/json_narrative_repository.py" in retained
          assert "ai-service/infrastructure/json_postgres_cutover.py" in retained
          assert "ai-service/application/migrate_json_to_postgres.py" in retained
          never = set(data["never_automatic"])
          assert "delete legacy JSON source files" in never
          assert "drop or truncate PostgreSQL user data" in never
          assert "set supervisor_cleanup_gate_accepted=true" in never
          print("P8-05 cleanup manifest safety contract: PASS")
          PY
