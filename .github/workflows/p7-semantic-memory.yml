name: P7 Semantic Memory Foundation

on:
  push:
    branches:
      - astra/p7-02-memory-pgvector-foundation
      - astra/p7-03-semantic-retriever
      - astra/p7-04-hybrid-ranker
  pull_request:
    paths:
      - "ai-service/**"
      - "docker-compose.yml"
      - ".github/workflows/p7-semantic-memory.yml"

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - run: pip install -r requirements.txt pytest httpx
      - name: Semantic-memory, retriever and hybrid-ranker unit tests
        run: pytest -q tests/test_semantic_memory_service.py tests/test_semantic_retriever.py tests/test_hybrid_ranker.py
      - name: Hybrid retrieval proxy regression
        run: pytest -q tests/test_p7_hybrid_benchmark.py
      - name: Benchmark invariant regression
        run: pytest -q tests/test_p7_embedding_benchmark.py
      - name: Phase 6 temporal/writing regressions
        run: pytest -q tests/test_p65_r1_temporal.py tests/test_p65_r2_final.py tests/test_writing_validation_golden.py

  pgvector-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: p7_semantic_memory
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d p7_semantic_memory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/p7_semantic_memory
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/p7_semantic_memory
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - run: pip install -r requirements.txt pytest httpx
      - name: Live PostgreSQL + pgvector integration
        run: pytest -o addopts= -q -m postgres_integration tests/test_semantic_memory_postgres_integration.py tests/test_semantic_retriever_postgres_integration.py

  root-compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config
      - name: Start production-path services
        env:
          LLM_PROVIDER: fake
          PLATFORM_SERVICE_TOKEN: test-token
          EMBEDDING_PROVIDER: fake
          SEMANTIC_RETRIEVAL_ENABLED: "true"
          ACTIVE_EMBEDDING_VERSION: fake-embedding-768-v1
        run: docker compose up -d --build postgres mongodb ai-service backend web
      - name: Wait for health
        run: |
          set -euo pipefail
          for i in {1..60}; do
            if curl -fsS http://localhost:8000/health >/dev/null && curl -fsS http://localhost:4000/api/v1/health >/dev/null && curl -fsS http://localhost:8080/ >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          docker compose ps
          docker compose logs ai-service backend postgres
          exit 1
      - name: Verify semantic retriever composition
        run: |
          set -euo pipefail
          docker compose exec -T ai-service python -c "import main; r=main.app.state.semantic_retriever; assert r is not None; assert r._hybrid_ranker is not None; assert r._hybrid_ranker.ranking_version == 'hybrid-v1'; assert main.app.state.semantic_materializer is not None"
          code="$(curl -sS -o /tmp/semantic-rebuild.json -w '%{http_code}' -X POST \
            -H 'Authorization: Bearer test-token' \
            -H 'X-Tenant-Id: 00000000-0000-0000-0000-000000000001' \
            -H 'X-Request-Id: p7-03-compose' \
            http://localhost:8000/internal/v1/story-brains/00000000-0000-0000-0000-000000000001/semantic-memory/rebuild)"
          test "$code" = "202"

      - name: Verify pgvector schema capability
        run: |
          set -euo pipefail
          docker compose exec -T postgres psql -U postgres -d ephurin -Atc "SELECT extname FROM pg_extension WHERE extname='vector'" | grep -qx vector
          docker compose exec -T postgres psql -U postgres -d ephurin -Atc "
            SELECT format_type(a.atttypid, a.atttypmod)
            FROM pg_attribute a
            JOIN pg_class c ON c.oid = a.attrelid
            JOIN pg_namespace n ON n.oid = c.relnamespace
            WHERE n.nspname='narrative'
              AND c.relname='memory_embeddings'
              AND a.attname='embedding'
              AND a.attnum > 0
              AND NOT a.attisdropped;
          " | grep -qx "vector(768)"
      - name: Verify existing AI auth boundary
        run: |
          set -euo pipefail
          route="http://localhost:8000/v1/story-brains/00000000-0000-0000-0000-000000000001/context-preview"
          missing="$(curl -sS -o /tmp/missing.json -w '%{http_code}' "$route")"
          invalid="$(curl -sS -o /tmp/invalid.json -w '%{http_code}' -H 'Authorization: Bearer invalid-token' "$route")"
          valid_route="http://localhost:8000/v1/story-brains/by-novel/00000000-0000-0000-0000-000000000001"
          valid="$(curl -sS -o /tmp/valid.json -w '%{http_code}' -H 'Authorization: Bearer test-token' "$valid_route")"
          test "$missing" = "401"
          test "$invalid" = "403"
          test "$valid" = "200"
      - name: Show service status
        if: always()
        run: docker compose ps
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color postgres mongodb ai-service backend web
      - name: Shutdown
        if: always()
        run: docker compose down -v
