name: P7 Semantic Memory Foundation

on:
  push:
    branches:
      - astra/p7-02-memory-pgvector-foundation
      - astra/p7-03-semantic-retriever
      - astra/p7-04-hybrid-ranker
      - astra/p7-05-context-budget
  pull_request:
    paths:
      - "ai-service/**"
      - "scripts/**"
      - "docs/development/CTX-RD-01-REAL-PROVIDER-STAGING-runbook.md"
      - "docker-compose.yml"
      - "docker-compose.flash-lite-demo.yml"
      - ".github/workflows/p7-semantic-memory.yml"

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - run: pip install -r requirements.txt pytest httpx
      - name: Semantic-memory, retrieval, hybrid and context-routing unit tests
        run: pytest -q tests/test_semantic_memory_service.py tests/test_semantic_retriever.py tests/test_hybrid_ranker.py tests/test_context_budget.py tests/test_context_scope.py tests/test_context_routing.py tests/test_settings.py tests/test_ctx_rd_staging_harness.py
      - name: CTX-RD-01 production/EVAL parity
        run: python ../scripts/verify_ctx_rd_01_eval_parity.py
      - name: CTX-RD-01 real-provider evidence contract self-test
        run: python ../scripts/verify_ctx_rd_01_real_provider_evidence.py --self-test
      - name: CTX-RD-01 opt-in canary evidence contract and frozen-source runner syntax
        run: |
          python ../scripts/verify_ctx_rd_01_opt_in_canary_evidence.py --self-test
          python ../scripts/verify_ctx_rd_01_opt_in_canary_evidence.py --evidence-dir ../docs/development/CTX-RD-01-OPT-IN-CANARY
          python -m py_compile ../scripts/run_ctx_rd_01_real_source_canary.py
      - name: CTX-RD-01 E2E guardrails (no DB or provider required)
        run: |
          pytest -q tests/test_ctx_rd_full_source_e2e.py
          python ../scripts/verify_ctx_rd_01_full_source_e2e_evidence.py --self-test
          python -m py_compile ../scripts/run_ctx_rd_01_full_source_e2e.py
      - name: CTX-RD-01 unadapted narrative E2E guardrails (no DB or provider required)
        run: |
          pytest -q tests/test_ctx_rd_unadapted_narrative_e2e.py
          python ../scripts/verify_ctx_rd_01_unadapted_narrative_e2e_evidence.py --self-test
          python -m py_compile ../scripts/run_ctx_rd_01_unadapted_narrative_e2e.py
      - name: Hybrid retrieval proxy regression
        run: pytest -q tests/test_p7_hybrid_benchmark.py
      - name: Hybrid retrieval proxy metrics
        run: |
          python - <<'PY'
          import json
          from benchmarks.p7_hybrid_ranker_benchmark import run_proxy
          result = run_proxy()
          print(json.dumps({
              "dataset_version": result["dataset_version"],
              "ranking_version": result["ranking_version"],
              "weights": result["weights"],
              "recent_at_10": result["recent"]["10"],
              "semantic_at_10": result["semantic"]["10"],
              "hybrid_at_10": result["hybrid"]["10"],
          }, indent=2))
          PY
      - name: Benchmark invariant regression
        run: pytest -q tests/test_p7_embedding_benchmark.py
      - name: Phase 6 temporal/writing regressions
        run: pytest -q tests/test_p65_r1_temporal.py tests/test_p65_r2_final.py tests/test_writing_validation_golden.py
      - name: Full AI-service non-PostgreSQL regression
        run: pytest -q

  pgvector-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: p7_semantic_memory
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d p7_semantic_memory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/p7_semantic_memory
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/p7_semantic_memory
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - run: pip install -r requirements.txt pytest httpx
      - name: Live PostgreSQL + pgvector integration
        run: pytest -o addopts= -q -m postgres_integration tests/test_semantic_memory_postgres_integration.py tests/test_semantic_retriever_postgres_integration.py
      - name: Relevance-scope PostgreSQL cutoff and supersede integration
        run: pytest -o addopts= -q -m postgres_integration tests/test_postgres_integration.py::test_chapter_25_event_and_state_isolation_from_chapter_5 tests/test_postgres_integration.py::test_recent_scope_participants_exclude_superseded_event_entities
      - name: P1 approved memory and entity HITL PostgreSQL contracts
        run: pytest -o addopts= -q -m postgres_integration tests/test_p1_memory_entity_hitl.py tests/test_p1_entity_semantics.py tests/test_p1_identity_final.py tests/test_p1_contract_alignment.py
      - name: Unadapted narrative PostgreSQL cutoff, supersession, and isolation integration
        run: pytest -o addopts= -q -m postgres_integration tests/test_unadapted_narrative_postgres_integration.py

  root-compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config
      - name: Validate opt-in real-demo Flash-Lite routing (no provider calls)
        env:
          GEMINI_API_KEY: ci-dummy-key-not-a-secret
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess

          command = [
              "docker", "compose",
              "-f", "docker-compose.yml",
              "-f", "docker-compose.flash-lite-demo.yml",
              "config", "--format", "json",
          ]
          for requested_model in ("gemini-3.5-flash-lite", "gemini-3.1-flash-lite"):
              env = {**os.environ, "DEMO_LLM_MODEL": requested_model}
              config = json.loads(subprocess.check_output(command, text=True, env=env))
              ai = config["services"]["ai-service"]["environment"]
              backend = config["services"]["backend"]["environment"]
              assert ai["LLM_PROVIDER"] == "gemini"
              assert str(ai["LLM_ENABLED"]).lower() == "true"
              assert ai["LLM_MODEL"] == requested_model
              assert str(ai["LLM_LOCAL_FALLBACK"]).lower() == "false"
              assert ai["CONTEXT_ROUTING_POLICY"] == "legacy-v1"
              assert backend["AI_LLM_MODEL"] == requested_model
              assert backend["AI_LLM_BASE_URL"] == "https://generativelanguage.googleapis.com/v1beta/openai"
              assert ai["GEMINI_API_KEY"] == backend["AI_LLM_API_KEY"] == env["GEMINI_API_KEY"]
          print("Demo profile model selection, provider and legacy routing verified")
          PY
      - name: Start production-path services
        env:
          LLM_PROVIDER: fake
          PLATFORM_SERVICE_TOKEN: test-token
          EMBEDDING_PROVIDER: fake
          SEMANTIC_RETRIEVAL_ENABLED: "true"
          ACTIVE_EMBEDDING_VERSION: fake-embedding-768-v1
        run: docker compose up -d --build postgres mongodb ai-service backend web
      - name: Wait for health
        run: |
          set -euo pipefail
          for i in {1..60}; do
            if curl -fsS http://localhost:8000/health >/dev/null && curl -fsS http://localhost:4000/api/v1/health >/dev/null && curl -fsS http://localhost:8080/ >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          docker compose ps
          docker compose logs ai-service backend postgres
          exit 1
      - name: Verify semantic retriever and context packer composition
        run: |
          set -euo pipefail
          docker compose exec -T ai-service python -c "import main; r=main.app.state.semantic_retriever; w=main.app.state.writing_service; assert r is not None; assert r._hybrid_ranker is not None; assert r._hybrid_ranker.ranking_version == 'hybrid-v1'; assert main.app.state.semantic_materializer is not None; assert w._context_packer is not None; assert w._context_packer.default_budget == 12000; assert w._context_scope_builder is not None; assert w._context_budget_router is not None; assert main.settings.context_routing_policy == 'legacy-v1'; assert w._context_routing_policy == 'legacy-v1'"
          code="$(curl -sS -o /tmp/semantic-rebuild.json -w '%{http_code}' -X POST \
            -H 'Authorization: Bearer test-token' \
            -H 'X-Tenant-Id: 00000000-0000-0000-0000-000000000001' \
            -H 'X-Request-Id: p7-03-compose' \
            http://localhost:8000/internal/v1/story-brains/00000000-0000-0000-0000-000000000001/semantic-memory/rebuild)"
          test "$code" = "202"

      - name: Verify pgvector schema capability
        run: |
          set -euo pipefail
          docker compose exec -T postgres psql -U postgres -d ephurin -Atc "SELECT extname FROM pg_extension WHERE extname='vector'" | grep -qx vector
          docker compose exec -T postgres psql -U postgres -d ephurin -Atc "
            SELECT format_type(a.atttypid, a.atttypmod)
            FROM pg_attribute a
            JOIN pg_class c ON c.oid = a.attrelid
            JOIN pg_namespace n ON n.oid = c.relnamespace
            WHERE n.nspname='narrative'
              AND c.relname='memory_embeddings'
              AND a.attname='embedding'
              AND a.attnum > 0
              AND NOT a.attisdropped;
          " | grep -qx "vector(768)"
      - name: Verify existing AI auth boundary
        run: |
          set -euo pipefail
          route="http://localhost:8000/v1/story-brains/00000000-0000-0000-0000-000000000001/context-preview"
          missing="$(curl -sS -o /tmp/missing.json -w '%{http_code}' "$route")"
          invalid="$(curl -sS -o /tmp/invalid.json -w '%{http_code}' -H 'Authorization: Bearer invalid-token' "$route")"
          valid_route="http://localhost:8000/v1/story-brains/by-novel/00000000-0000-0000-0000-000000000001"
          valid="$(curl -sS -o /tmp/valid.json -w '%{http_code}' -H 'Authorization: Bearer test-token' "$valid_route")"
          test "$missing" = "401"
          test "$invalid" = "403"
          test "$valid" = "200"
      - name: Verify bounded context preview
        run: |
          set -euo pipefail
          novel_id="00000000-0000-0000-0000-000000000001"
          curl -fsS -H 'Authorization: Bearer test-token'             "http://localhost:8000/v1/story-brains/by-novel/$novel_id" >/tmp/brain.json
          curl -fsS             -H 'Authorization: Bearer test-token'             -H 'X-Tenant-Id: 00000000-0000-0000-0000-000000000001'             -H 'X-Request-Id: p7-05-budget'             "http://localhost:8000/v1/story-brains/$novel_id/context-preview?token_budget=80"             >/tmp/context.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/context.json"))["data"]
          budget=data["token_budget"]
          print(json.dumps(budget, sort_keys=True))
          assert budget["maximum"] == 80
          assert budget["used"] <= 80 or budget["protected_overflow"]
          assert budget["packing_version"] == "context-budget-v1"
          assert budget["estimator_version"] == "utf8-json-bytes-3-v1"
          PY
      - name: Show service status
        if: always()
        run: docker compose ps
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color postgres mongodb ai-service backend web
      - name: Shutdown
        if: always()
        run: docker compose down -v
