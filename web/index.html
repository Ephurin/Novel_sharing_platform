<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ephurin Author IDE</title>
    <!-- Google Fonts: Diverse literary serif & modern sans-serif fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Roboto+Slab:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Material Symbols Outlined -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <!-- Tailwind CSS v3 with Forms & Container Queries -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              serif: ['Merriweather', 'Georgia', 'serif'],
              sans: ['"Be Vietnam Pro"', '"Plus Jakarta Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
              'headline-lg': ['Merriweather', 'serif'],
              'headline-md': ['Merriweather', 'serif'],
              'headline-sm': ['"Be Vietnam Pro"', 'sans-serif'],
              'body-reading': ['Merriweather', 'serif'],
              'body-lg': ['"Be Vietnam Pro"', 'sans-serif'],
              'body-md': ['"Be Vietnam Pro"', 'sans-serif'],
              'label-md': ['"Be Vietnam Pro"', 'sans-serif'],
              'label-sm': ['"Be Vietnam Pro"', 'sans-serif']
            },
            colors: {
              primary: {
                DEFAULT: '#3525cd',
                50: '#eef2ff',
                100: '#e0e7ff',
                200: '#c7d2fe',
                300: '#a5b4fc',
                400: '#818cf8',
                500: '#6366f1',
                600: '#4f46e5',
                700: '#4338ca',
                800: '#3730a3',
              },
              'primary-container': '#4f46e5',
              'on-primary': '#ffffff',
              'primary-fixed': '#e2dfff',
              'primary-fixed-dim': '#c3c0ff',
              'on-primary-container': '#dad7ff',
              secondary: '#4953bc',
              'secondary-container': '#8792fe',
              'on-secondary': '#ffffff',
              'on-secondary-container': '#17228f',
              tertiary: '#484757',
              'tertiary-fixed': '#e4e0f5',
              'on-tertiary': '#ffffff',
              surface: '#faf8ff',
              'surface-dim': '#d2d9f4',
              'surface-bright': '#faf8ff',
              'on-surface': '#131b2e',
              'on-surface-variant': '#464555',
              'surface-container-lowest': '#ffffff',
              'surface-container-low': '#f2f3ff',
              'surface-container': '#eaedff',
              'surface-container-high': '#e2e7ff',
              'surface-container-highest': '#dae2fd',
              'inverse-surface': '#283044',
              'inverse-on-surface': '#eef0ff',
              outline: '#777587',
              'outline-variant': '#c7c4d8',
              error: '#ba1a1a',
              'error-container': '#ffdad6',
              paper: '#faf9f6',
              cream: '#f5f4ef',
            },
            spacing: {
              'space-xs': '0.25rem',
              'space-sm': '0.5rem',
              'space-md': '1rem',
              'space-lg': '1.5rem',
              'space-xl': '2.5rem',
              'gutter': '1.5rem',
              'gutter-sm': '1rem',
              'gutter-lg': '2rem',
              'margin-sm': '1rem',
              'margin-lg': '3rem',
            }
          }
        }
      }
    </script>
    <style>
      /* Theme scrollbar styling */
      * {
        scrollbar-width: thin;
        scrollbar-color: #dcd8ce transparent;
      }
      ::-webkit-scrollbar {
        width: 7px;
        height: 7px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #dcd8ce;
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #a8a29e;
      }

      .manuscript-body {
        font-family: 'Merriweather', Georgia, serif;
      }
      .font-family-merriweather { font-family: 'Merriweather', Georgia, serif; }
      .font-family-lora { font-family: 'Lora', Georgia, serif; }
      .font-family-literata { font-family: 'Literata', Georgia, serif; }
      .font-family-playfair { font-family: 'Playfair Display', Georgia, serif; }
      .font-family-roboto-slab { font-family: 'Roboto Slab', Georgia, serif; }
      .font-family-vietnam { font-family: 'Be Vietnam Pro', sans-serif; }
      .font-family-jakarta { font-family: 'Plus Jakarta Sans', sans-serif; }
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20;
        font-size: 18px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        vertical-align: middle;
      }
      .material-symbols-outlined.fill-icon {
        font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 20;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
