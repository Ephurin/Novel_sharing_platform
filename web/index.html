<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="/theme-init.js"></script>
    <title>StoryCraft — Văn Hoa</title>
    <!-- Existing fonts and Tailwind utilities are bundled by Vite/PostCSS; no runtime CDN. -->
<style>
      /* Theme scrollbar styling */
      * {
        scrollbar-width: thin;
        scrollbar-color: var(--sc-border) transparent;
      }
      ::-webkit-scrollbar {
        width: 7px;
        height: 7px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--sc-border);
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--sc-text-muted);
      }

      .manuscript-body {
        font-family: 'Merriweather', Georgia, serif;
      }
      .font-family-merriweather { font-family: 'Merriweather', Georgia, serif; }
      .font-family-lora { font-family: 'Lora', Georgia, serif; }
      .font-family-literata { font-family: 'Literata', Georgia, serif; }
      .font-family-playfair { font-family: 'Playfair Display', Georgia, serif; }
      .font-family-roboto-slab { font-family: 'Roboto Slab', Georgia, serif; }
      .font-family-vietnam { font-family: 'Be Vietnam Pro', sans-serif; }
      .font-family-jakarta { font-family: 'Plus Jakarta Sans', sans-serif; }
      .material-symbols-outlined {
        font-family: 'Material Symbols Outlined Variable';
        font-weight: normal; font-style: normal; line-height: 1; letter-spacing: normal;
        text-transform: none; white-space: nowrap; word-wrap: normal; direction: ltr;
        -webkit-font-feature-settings: 'liga'; -webkit-font-smoothing: antialiased;
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20;
        font-size: 18px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        vertical-align: middle;
      }
      .material-symbols-outlined.fill-icon {
        font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 20;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
