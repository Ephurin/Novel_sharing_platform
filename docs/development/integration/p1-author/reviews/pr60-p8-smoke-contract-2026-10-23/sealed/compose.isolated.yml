services:
  postgres:
    ports: !override
      - "127.0.0.1:51879:5432"
    environment:
      POSTGRES_DB: ephurin_test_pr60_1b2c0d6f1b
  mongodb:
    ports: !override
      - "127.0.0.1:51880:27017"
  ai-service:
    ports: !override
      - "127.0.0.1:51881:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/ephurin_test_pr60_1b2c0d6f1b
      LLM_PROVIDER: fake
      LLM_BASE_URL: http://127.0.0.1:9/v1
      LLM_API_KEY: ""
      GEMINI_API_KEY: ""
      GOOGLE_API_KEY: ""
      OPENAI_API_KEY: ""
      EMBEDDING_PROVIDER: fake
      SEMANTIC_RETRIEVAL_ENABLED: "true"
      ACTIVE_EMBEDDING_VERSION: fake-embedding-768-v1
  backend:
    ports: !override
      - "127.0.0.1:51882:4000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ephurin_test_pr60_1b2c0d6f1b
      MONGODB_URI: mongodb://mongodb:27017/ephurin_test_pr60_1b2c0d6f1b
      AI_LLM_BASE_URL: http://127.0.0.1:9/v1
      AI_LLM_API_KEY: ""
  web:
    ports: !override
      - "127.0.0.1:51883:80"
networks:
  default:
    internal: true
