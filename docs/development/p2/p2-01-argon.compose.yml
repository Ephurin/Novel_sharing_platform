services:
  pg:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: p2a
      POSTGRES_USER: p2
      POSTGRES_PASSWORD: p2-offline-fixture
    ports:
      - "127.0.0.1:57432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U p2 -d p2a"]
      interval: 3s
      timeout: 3s
      retries: 30
  mongo:
    image: mongo:7
    ports:
      - "127.0.0.1:57017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ping:1})"]
      interval: 3s
      timeout: 5s
      retries: 30
