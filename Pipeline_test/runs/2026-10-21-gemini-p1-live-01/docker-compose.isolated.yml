services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: p1-live-01-postgres
    environment:
      POSTGRES_DB: p1_ephurin
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:25432:5432"
    volumes:
      - p1_live_01_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d p1_ephurin" ]
      interval: 3s
      timeout: 3s
      retries: 20

  mongodb:
    image: mongo:7
    container_name: p1-live-01-mongodb
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - p1_live_01_mongodb_data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok" ]
      interval: 5s
      timeout: 3s
      retries: 20

  budget-gateway:
    image: python:3.11-slim
    container_name: p1-live-01-budget-gateway
    working_dir: /workspace
    command: >
      python -u -c "
      import sys; sys.path.insert(0, '/workspace/Pipeline_test/tools');
      from budget_gateway import start_budget_gateway;
      from pathlib import Path;
      import time, os;
      state_file = Path('/workspace/Pipeline_test/runs/2026-10-21-gemini-p1-live-01/budget_state.json');
      server, th, ledger = start_budget_gateway(
          state_file=state_file,
          host='0.0.0.0',
          port=18090,
          max_calls=int(os.getenv('MAX_CALLS', '200')),
          max_cost_usd=float(os.getenv('MAX_COST_USD', '5.00')),
          admission_cost_usd=float(os.getenv('ADMISSION_COST_USD', '4.50')),
          max_wall_clock_seconds=int(os.getenv('MAX_WALL_CLOCK_SECONDS', '7200')),
          upstream_base_url=os.getenv('UPSTREAM_BASE_URL', 'https://generativelanguage.googleapis.com/v1beta/openai'),
          upstream_api_key=os.getenv('GEMINI_API_KEY', ''),
      );
      print('[BUDGET_GATEWAY] Running authoritative gateway on port 18090...');
      th.join()
      "
    environment:
      MAX_CALLS: 200
      MAX_COST_USD: "5.00"
      ADMISSION_COST_USD: "4.50"
      MAX_WALL_CLOCK_SECONDS: 7200
      UPSTREAM_BASE_URL: https://generativelanguage.googleapis.com/v1beta/openai
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - ../../../:/workspace
    ports:
      - "127.0.0.1:18090:18090"
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:18090/health')" ]
      interval: 3s
      timeout: 3s
      retries: 10

  ai-service:
    build:
      context: ../../../ai-service
      dockerfile: Dockerfile
    container_name: p1-live-01-ai-service
    environment:
      APP_ENV: production
      PORT: 8000
      NARRATIVE_REPOSITORY: postgres
      LLM_ENABLED: "true"
      LLM_PROVIDER: gemini
      LLM_MODEL: gemini-3.5-flash-lite
      GEMINI_API_KEY: ""
      BUDGET_GUARD_URL: http://budget-gateway:18090
      LLM_BASE_URL: http://budget-gateway:18090/v1
      LLM_FALLBACK_PROVIDER: ""
      LLM_LOCAL_FALLBACK: "false"
      LLM_STRUCTURED_MAX_TOKENS: 8192
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-p1_ephurin}
      PLATFORM_API_BASE_URL: http://backend:4000
      PLATFORM_SERVICE_TOKEN: ${PLATFORM_SERVICE_TOKEN:-test-token-p1-live-01}
      ENTITY_CANDIDATE_VERIFICATION_ENABLED: "true"
      CONTEXT_ROUTING_POLICY: legacy-v1
    ports:
      - "127.0.0.1:18000:8000"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8000/health || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      budget-gateway:
        condition: service_healthy

  backend:
    build:
      context: ../../../
      dockerfile: backend/Dockerfile
    container_name: p1-live-01-backend
    environment:
      NODE_ENV: production
      PORT: 4000
      API_PREFIX: /api/v1
      WEB_ORIGIN: http://localhost:18080
      DB_CONNECT_ON_START: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-p1_ephurin}
      MONGODB_URI: mongodb://mongodb:27017/${POSTGRES_DB:-p1_ephurin}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-p1-live-01-demo-access-secret-isolated}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-p1-live-01-demo-refresh-secret-isolated}
      JWT_ACCESS_EXPIRES_SECONDS: 3600
      JWT_REFRESH_EXPIRES_DAYS: 7
      REFRESH_TOKEN_COOKIE_NAME: ephurin_p1_refresh_token
      RUN_MIGRATIONS: "true"
      RUN_DEMO_SEED: "false"
      AI_SERVICE_URL: http://ai-service:8000
      PLATFORM_SERVICE_TOKEN: ${PLATFORM_SERVICE_TOKEN:-test-token-p1-live-01}
      AI_LLM_BASE_URL: http://budget-gateway:18090/v1
      AI_LLM_API_KEY: ""
      AI_LLM_MODEL: gemini-3.5-flash-lite
    ports:
      - "127.0.0.1:14000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      budget-gateway:
        condition: service_healthy

  web:
    build:
      context: ../../../
      dockerfile: web/Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: p1-live-01-web
    ports:
      - "127.0.0.1:18080:80"
    depends_on:
      - backend

volumes:
  p1_live_01_postgres_data:
  p1_live_01_mongodb_data:
